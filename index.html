<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --pw-amber:#FF9800;
    --pw-amber-deep:#E07B00;
    --pw-ink:#131311;
    --pw-ink-soft:#1C1C19;
    --pw-surface:#EDEDEA;
    --pw-muted:#6E6E6A;
    --pw-border:#B9B9B4;
    --pw-white:#FFFFFF;
    --pw-good:#2E7D4F;
    --font-h:'Archivo','Helvetica Neue',Arial,sans-serif;
    --font-b:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--pw-white);
    color:var(--pw-ink);
    font-family:var(--font-b);
    -webkit-font-smoothing:antialiased;
    padding-inline:0;
  }
  img{max-width:100%;}

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding-inline:20px;
  }

  h1,h2,h3,h4{
    font-family:var(--font-h);
    text-transform:uppercase;
    letter-spacing:0.01em;
    margin:0;
    text-wrap:balance;
  }

  a{color:var(--pw-amber-deep);}

  /* ---------- header ---------- */
  header.site{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--pw-ink);
    border-bottom:1px solid #2A2A26;
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-block:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    font-family:var(--font-h);
    font-weight:900;
    font-size:18px;
    letter-spacing:0.02em;
    color:var(--pw-white);
    white-space:nowrap;
  }
  .brand-mark span{color:var(--pw-amber);}
  .brand-sub{
    display:none;
    color:#B9B9B4;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-left:1px solid #3A3A36;
    padding-left:10px;
  }
  @media(min-width:560px){ .brand-sub{display:block;} }
  .header-cta{
    display:flex;
    gap:8px;
  }
  .icon-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--pw-amber);
    color:var(--pw-ink);
    font-family:var(--font-h);
    font-weight:800;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    text-decoration:none;
    padding:9px 12px;
    border-radius:5px;
    white-space:nowrap;
  }
  .icon-btn:hover{background:var(--pw-amber-deep);color:var(--pw-white);}

  /* ---------- hero ---------- */
  .hero{
    background:
      radial-gradient(ellipse 900px 500px at 80% -10%, rgba(255,152,0,0.18), transparent 60%),
      var(--pw-ink);
    color:var(--pw-white);
    padding-block:44px 40px;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:34px;
    align-items:center;
  }
  @media(min-width:860px){
    .hero-grid{grid-template-columns:1.15fr 0.85fr;gap:24px;}
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,152,0,0.14);
    border:1px solid rgba(255,152,0,0.4);
    color:var(--pw-amber);
    font-family:var(--font-h);
    font-weight:800;
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;

  .btn-ghost{background:transparent;color:var(--pw-white);border:2px solid rgba(255,255,255,0.35);}

  .device-stage{
    display:flex;
    justify-content:center;

  .phone{
    position:relative;
    width:184px;
    height:378px;
    background:linear-gradient(160deg,#3a3a36,#131311 55%);
    border-radius:42px;
    border:2px solid #46463f;

  .phone::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:32px;
    background:linear-gradient(200deg,#232320,#0c0c0b 70%);
  }
  .phone .island{
    position:absolute;
    top:22px;left:50%;
    transform:translateX(-50%);
    width:64px;height:19px;
    background:#000;
    border-radius:12px;
  }
  .phone .cam{
    position:absolute;
    top:44px;left:22px;
    width:70px;height:70px;
    background:linear-gradient(160deg,#2c2c28,#131311);
    border-radius:20px;
    border:1px solid #3d3d38;
  }
  .phone .lens{
    position:absolute;
    width:26px;height:26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a4a44, #0a0a09 70%);
    border:1px solid #4a4a44;

  .phone .lens.l1{top:6px;left:6px;}

    text-align:center;

  .cd-num{
    font-family:var(--font-h);

  .launch-live{
    margin-top:30px;

    color:#BFE3CC;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
    padding:12px 16px;
    border-radius:10px;
    max-width:52ch;

  .launch-live b{color:var(--pw-white);}
  .launch-live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--pw-good);
    flex:none;
    margin-top:2px;
    box-shadow:0 0 0 3px rgba(46,125,79,0.25);
  }
  /* Both .countdown and .launch-live set their own "display" value, which
     otherwise overrides the browser's default [hidden]{display:none} rule
     at equal specificity — these explicit overrides make hiding actually work. */
  .countdown[hidden]{display:none;}
  .launch-live[hidden]{display:none;}

    color:var(--pw-ink);
    text-align:center;

    margin-bottom:8px;

    font-size:clamp(24px,3.6vw,32px);

    line-height:1.12;
  }
  .section-head p{
    color:var(--pw-muted);
    font-size:15px;

  }

  .prod-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
  }
  @media(min-width:720px){ .prod-grid{grid-template-columns:1fr 1fr;} }
  .prod-card{
    background:var(--pw-surface);
    border:1px solid var(--pw-border);
    border-radius:12px;
    padding:26px;
    display:flex;
    flex-direction:column;
    gap:16px;

  .prod-card.featured{
    background:var(--pw-ink);
    border-color:var(--pw-ink);

  .spec-list{
    list-style:none;

    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:13.5px;
  }

    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .spec-list li::before{
    content:"";

    border-radius:50%;
    background:var(--pw-amber);
    margin-top:6px;
    flex:none;
  }
  .prod-card .btn{margin-top:auto;width:100%;justify-content:center;}

    align-items:start;
    background:var(--pw-ink);
    border-radius:16px;
    padding:30px 20px;
    color:var(--pw-white);
  }
